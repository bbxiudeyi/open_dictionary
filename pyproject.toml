[project]
name = "open-dictionary"
version = "0.1.0"
description = "划词翻译 + 生词本桌面工具(OCR / NLLB-200 本地离线翻译)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<7",
    "mss>=9.0",
    "keyboard>=0.13.5",
    "rapidocr-onnxruntime>=1.3.7",
    "numpy>=1.24,<2.0",
    "ctranslate2>=4.0,<5",
    "transformers>=4.38,<5",
    "sentencepiece>=0.1.99",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyinstaller>=6.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: 需要本地模型文件的用例(默认不跑,用 -m slow 运行)",
]
testpaths = ["tests"]
addopts = "-m 'not slow'"
